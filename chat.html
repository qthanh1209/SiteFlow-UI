<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteFlow — Chat</title>
<script>
(function(){
  try{
    var t = localStorage.getItem('siteflow-theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-alt:#EDEFF4; --border:#E2E5EC;
  --text:#161A22; --text-muted:#6B7280; --text-faint:#9AA1B2;
  --primary:#2F5DA8; --primary-tint:#E8EEFB;
  --attendance:#0E8A82; --attendance-tint:#E1F5F2;
  --finance:#B7791F; --finance-tint:#FBF1DC;
  --danger:#C0392B; --danger-tint:#FBEBE9;
  --success:#1E8E5A; --success-tint:#E7F6EE;
  --scrollbar-thumb:#cbd1da;
}
html[data-theme="dark"]{
  --bg:#12151C; --surface:#1A1E27; --surface-alt:#20242F; --border:#2B303C;
  --text:#E7E9EE; --text-muted:#98A0B3; --text-faint:#6C7488;
  --primary:#6C9BEA; --primary-tint:#1E2A42;
  --attendance:#3FC2B6; --attendance-tint:#123330;
  --finance:#E0AC4F; --finance-tint:#3A2E14;
  --danger:#E0685A; --danger-tint:#3A211E;
  --success:#4FC585; --success-tint:#15301F;
  --scrollbar-thumb:#333a45;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--text);
  font-size:14px; display:flex; overflow:hidden; transition:background .15s ease, color .15s ease;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb); border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- App shell sidebar ---------- */
.app-sidebar{
  width:232px; flex:none; background:#12161F; color:#AEB4C2;
  display:flex; flex-direction:column; padding:22px 14px; box-sizing:border-box;
}
.app-sidebar .brand{display:flex; align-items:center; gap:10px; padding:0 8px 26px 8px;}
.app-sidebar .brand .mark{width:30px; height:30px; border-radius:8px; background:#2F5DA8; display:flex; align-items:center; justify-content:center; flex:none;}
.app-sidebar .brand .word{font-family:'Sora'; font-weight:700; font-size:17px; color:#fff;}
.app-sidebar nav{display:flex; flex-direction:column; gap:2px;}
.app-sidebar nav a{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:9px; color:#AEB4C2; text-decoration:none; border-left:3px solid transparent; position:relative;}
.app-sidebar nav a.active{background:rgba(47,93,168,.35); color:#fff; font-weight:600; border-left-color:#2F5DA8;}
.app-sidebar nav a .navbadge{margin-left:auto; background:var(--danger); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:20px;}
.app-sidebar .grow{flex:1;}
.app-sidebar .who{display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:1px solid #262B37;}
.app-sidebar .who .av{width:32px; height:32px; border-radius:50%; background:#2A3040; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12.5px; flex:none;}
.app-sidebar .who .name{color:#fff; font-weight:600; font-size:13px;}
.app-sidebar .who .role{color:#7C8399; font-size:11.5px;}
.app-sidebar{transition:width .18s ease;}
.app-sidebar.collapsed{width:76px !important;}
.app-sidebar.collapsed .brand{flex-direction:column !important; gap:8px !important;}
.app-sidebar.collapsed .word{display:none !important;}
.app-sidebar.collapsed nav a{justify-content:center !important; padding-left:0 !important; padding-right:0 !important;}
.app-sidebar.collapsed .nav-label{display:none !important;}
.app-sidebar.collapsed .navbadge{display:none !important;}
.navbadge-dot{display:none; position:absolute; top:6px; left:30px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:1.5px solid #12161F;}
.app-sidebar.collapsed .navbadge-dot{display:block;}
.app-sidebar.collapsed .who{justify-content:center !important; padding-left:0 !important;}
.app-sidebar.collapsed .who-info{display:none !important;}
.sidebar-collapse-btn{width:22px; height:22px; border-radius:6px; border:1px solid #262B37; background:transparent; color:#AEB4C2; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; margin-left:auto;}
.sidebar-collapse-btn:hover{color:#fff; border-color:#3A4150;}
.sidebar-collapse-btn svg{transition:transform .18s ease;}
.app-sidebar.collapsed .sidebar-collapse-btn{margin-left:0 !important;}
.app-sidebar.collapsed .sidebar-collapse-btn svg{transform:rotate(180deg);}

/* ---------- Chat shell ---------- */
.chat-shell{flex:1; display:flex; min-width:0; height:100%;}

/* conversation list */
.conv-list{width:320px; flex:none; border-right:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column;}
.conv-head{padding:16px 16px 12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:12px; flex-shrink:0;}
.conv-head .row1{display:flex; align-items:center; justify-content:space-between;}
.conv-head h2{font-size:19px; font-weight:800;}
.icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.icon-btn:hover{color:var(--text); border-color:var(--primary);}
.search-box{position:relative;}
.search-box input{width:100%; background:var(--surface-alt); border:1px solid var(--border); color:var(--text); padding:8px 12px 8px 32px; border-radius:8px; font-size:12.5px; font-family:inherit;}
.search-box input:focus{outline:none; border-color:var(--primary);}
.search-box svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5;}
.conv-tabs{display:flex; gap:6px;}
.conv-tabs button{border:none; background:none; color:var(--text-muted); font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:7px; cursor:pointer;}
.conv-tabs button.active{background:var(--primary-tint); color:var(--primary);}

.conv-items{flex:1; overflow-y:auto;}
.conv-item{display:flex; gap:11px; padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--border); position:relative;}
.conv-item:hover{background:var(--surface-alt);}
.conv-item.active{background:var(--primary-tint);}
.conv-avatar{width:42px; height:42px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; position:relative;}
.conv-avatar.round{border-radius:50%;}
.conv-avatar .dot-online{position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; background:var(--success); border:2px solid var(--surface);}
.conv-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.conv-top{display:flex; align-items:baseline; justify-content:space-between; gap:6px;}
.conv-name{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.conv-time{font-size:11px; color:var(--text-faint); flex:none;}
.conv-bottom{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.conv-preview{font-size:12.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.conv-unread{background:var(--danger); color:#fff; font-size:10.5px; font-weight:700; min-width:18px; height:18px; padding:0 5px; border-radius:20px; display:flex; align-items:center; justify-content:center; flex:none;}

/* thread */
.thread{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg);}
.thread-head{height:64px; flex:none; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; padding:0 20px; gap:12px;}
.thread-head .t-avatar{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex:none;}
.thread-head .t-avatar.round{border-radius:50%;}
.thread-head .t-name{font-weight:700; font-size:14.5px;}
.thread-head .t-sub{font-size:11.5px; color:var(--text-muted);}
.thread-actions{margin-left:auto; display:flex; gap:8px;}

.thread-messages{flex:1; overflow-y:auto; padding:22px 26px; display:flex; flex-direction:column;}
.date-divider{align-self:center; background:var(--surface-alt); color:var(--text-muted); font-size:11px; font-weight:600; padding:4px 14px; border-radius:20px; margin:8px 0 18px;}
.msg-group{display:flex; gap:11px; margin-top:16px; max-width:72%;}
.msg-group.own{align-self:flex-end; flex-direction:row-reverse; max-width:66%;}
.msg-group .g-avatar{width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px;}
.msg-group .g-col{display:flex; flex-direction:column; gap:5px; min-width:0;}
.msg-group.own .g-col{align-items:flex-end;}
.sender-name{font-size:12px; font-weight:600; color:var(--text-muted); padding-left:2px;}
.bubble{background:var(--surface); border:1px solid var(--border); padding:9px 13px; border-radius:4px 14px 14px 14px; font-size:13.5px; line-height:1.55; max-width:100%; word-wrap:break-word;}
.msg-group.own .bubble{background:var(--primary); color:#fff; border-color:var(--primary); border-radius:14px 4px 14px 14px;}
.msg-time{font-size:10.5px; color:var(--text-faint); padding:0 2px;}
.file-chip{display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-top:2px;}
.msg-group.own .file-chip{background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.3);}
.file-chip .f-icon{width:30px; height:30px; border-radius:7px; background:var(--danger-tint); color:var(--danger); display:flex; align-items:center; justify-content:center; flex:none;}
.file-chip .f-name{font-size:12.5px; font-weight:600;}
.file-chip .f-size{font-size:11px; color:var(--text-muted);}
.msg-group.own .file-chip .f-size{color:rgba(255,255,255,.75);}

.bot-card{align-self:center; max-width:78%; display:flex; gap:10px; align-items:flex-start; border:1px solid var(--danger); background:var(--danger-tint); color:var(--danger); border-radius:12px; padding:11px 14px; margin:14px 0; font-size:12.5px;}
.bot-card.info{border-color:var(--primary); background:var(--primary-tint); color:var(--primary);}
.bot-card .bc-icon{flex:none; margin-top:1px;}
.bot-card .bc-text strong{display:block; font-size:12.5px; margin-bottom:2px;}
.bot-card .bc-meta{font-size:10.5px; opacity:.75; margin-top:3px;}

.typing{padding:0 26px 8px; font-size:11.5px; color:var(--text-muted); font-style:italic; height:18px;}

.composer{flex:none; border-top:1px solid var(--border); background:var(--surface); padding:10px 18px 14px;}
.composer-toolbar{display:flex; gap:4px; margin-bottom:6px;}
.composer-row{display:flex; align-items:flex-end; gap:10px;}
.composer textarea{flex:1; resize:none; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); border-radius:12px; padding:10px 14px; font-family:inherit; font-size:13.5px; line-height:1.5; max-height:120px;}
.composer textarea:focus{outline:none; border-color:var(--primary);}
.send-btn{width:38px; height:38px; border-radius:10px; border:none; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.send-btn:hover{filter:brightness(1.08);}

/* info panel */
.info-panel{width:272px; flex:none; border-left:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:22px;}
.info-hero{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;}
.info-hero .avatar-lg{width:64px; height:64px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:22px;}
.info-hero .avatar-lg.round{border-radius:50%;}
.info-hero .name{font-weight:700; font-size:14.5px;}
.info-hero .sub{font-size:11.5px; color:var(--text-muted);}
.info-section .sec-title{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); font-weight:600; margin-bottom:10px;}
.member-row{display:flex; align-items:center; gap:9px; padding:5px 0;}
.member-row .m-avatar{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10.5px; font-weight:700; flex:none;}
.member-row .m-name{font-size:12.5px; font-weight:500;}
.member-row .m-role{font-size:10.5px; color:var(--text-muted);}
.file-row{display:flex; align-items:center; gap:9px; padding:6px 0;}
.file-row .f-ico{width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:none;}
.file-row .f-n{font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.file-row .f-m{font-size:10.5px; color:var(--text-muted);}
</style>
</head>

<div class="chat-shell">

  <div class="conv-list">
    <div class="conv-head">
      <div class="row1">
        <h2>Chat</h2>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" id="themeToggle" title="Chuyển giao diện sáng/tối">
            <svg id="themeIconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>

          </button>
          <button class="icon-btn" title="Soạn tin nhắn mới">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="convSearch" type="text" placeholder="Tìm cuộc trò chuyện...">
      </div>
      <div class="conv-tabs">
        <button class="active" data-tab="all">Tất cả</button>
        <button data-tab="unread">Chưa đọc</button>
      </div>
    </div>
    <div class="conv-items" id="convItems"></div>
  </div>

  <div class="thread" id="threadCol">
    <div class="thread-head" id="threadHead"></div>
    <div class="thread-messages" id="threadMessages"></div>
    <div class="typing" id="typingHint"></div>
    <div class="composer">
      <div class="composer-toolbar">
        <button class="icon-btn" title="Đính kèm tệp"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L10.13 17.1a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>

</div>

<script>

const COLORS = { blue:'#2F5DA8', teal:'#0E8A82', amber:'#B7791F', purple:'#7658C2', green:'#1E8E5A', pink:'#C2618F', gray:'#5B6472' };

      {who:'Chị Hoa', color:COLORS.pink, time:'10:22', text:'Em đã cập nhật bản vẽ điện tầng 2, mọi người xem giúp em ạ', file:{name:'Ban_ve_dien_tang2.pdf', size:'2.4 MB'}},

      {bot:true, level:'amber', time:'11:05', title:'Chấm công ngoài vùng', text:'1 nhân sự chấm công ngoài bán kính công trường tại Kho vật tư Bình Chánh, cần giám sát duyệt.', meta:'Module Chấm công'},

    members:[], files:[],
    messages:[
      {who:'Ngọc Hà', color:COLORS.amber, time:'Hôm qua', text:'Anh ơi vật tư thép đợt 2 chắc tuần sau mới về kịp ạ'},

  {
    id:'dm2', type:'dm', name:'Phan Bảo Ngọc', sub:'Kế toán trưởng', icon:null, color:COLORS.green, unread:1, online:false,
    members:[], files:[],
    messages:[
      {who:'Phan Bảo Ngọc', color:COLORS.green, time:'11:02', text:'Anh ơi hoá đơn INV-0142 bên khách hàng ABC vẫn chưa thanh toán ạ'},
      {who:'Phan Bảo Ngọc', color:COLORS.green, time:'11:03', text:'Đã quá hạn 5 ngày rồi, anh nhắc giúp em với'},
    ]
  },
  {
    id:'g2', type:'group', name:'Ban chỉ huy công trường', sub:'8 thành viên', icon:'hardhat', color:COLORS.teal, unread:0,
    members:[
      {name:'Nguyễn Đức Anh', role:'Chỉ huy trưởng', color:COLORS.blue},
      {name:'Đỗ Thành Long', role:'Tư vấn giám sát', color:COLORS.teal},
      {name:'Trần Anh', role:'Quản lý dự án (bạn)', color:COLORS.purple},
    ],
    files:[],
    messages:[
      {who:'Nguyễn Đức Anh', color:COLORS.blue, time:'Hôm qua', text:'Họp giao ban 8h sáng mai tại văn phòng công trường nhé mọi người'},
      {who:'Đỗ Thành Long', color:COLORS.teal, time:'Hôm qua', text:'Rõ anh, em chuẩn bị báo cáo giám sát'},
    ]
  },
  {
    id:'dm3', type:'dm', name:'Lê Văn', sub:'Đội thi công A', icon:null, color:COLORS.teal, unread:0, online:false,
    members:[], files:[],
    messages:[
      {who:ME, time:'Hôm qua', text:'Móng đài cọc xong chưa em?'},
      {who:'Lê Văn', color:COLORS.teal, time:'Hôm qua', text:'Vâng anh, móng đã xong 100% rồi ạ'},
    ]
  },
  {
    id:'g3', type:'group', name:'Đội thi công B', sub:'12 thành viên', icon:'hardhat', color:COLORS.amber, unread:0,
    members:[
      {name:'Ngọc Hà', role:'Đội trưởng', color:COLORS.amber},
      {name:'Vũ Hải Nam', role:'Thành viên', color:COLORS.blue},
    ],
    files:[],
    messages:[
      {who:'Vũ Hải Nam', color:COLORS.blue, time:'Hôm qua', text:'Vật tư về rồi mọi người ơi, ra bốc dỡ giúp'},
    ]
  },
];

let activeId = 'g1';
let filterTab = 'all';
let searchTerm = '';

function initials(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length===1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function iconSvg(kind, color){
  const stroke = '#fff';
  if(kind==='building') return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v18"/><path d="M6 12h12M6 8h12M6 16h12"/><path d="M10 22v-4h4v4"/></svg>`;
  if(kind==='hardhat') return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M5 18a7 7 0 0 1 14 0"/><path d="M12 8v3"/><path d="M9 4h6"/></svg>`;
  if(kind==='bot') return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="9" cy="14" r="1.2" fill="${stroke}" stroke="none"/><circle cx="15" cy="14" r="1.2" fill="${stroke}" stroke="none"/></svg>`;
  return '';
}

function convAvatarHTML(c, size){
  const s = size||42;
  if(c.type==='dm'){
    return `<div class="conv-avatar round" style="width:${s}px;height:${s}px;background:${c.color}">${initials(c.name)}${c.online?'<span class="dot-online"></span>':''}</div>`;
  }
  if(c.type==='bot'){
    return `<div class="conv-avatar" style="width:${s}px;height:${s}px;background:${c.color}">${iconSvg('bot',c.color)}</div>`;
  }
  return `<div class="conv-avatar" style="width:${s}px;height:${s}px;background:${c.color}">${iconSvg(c.icon,c.color)}</div>`;
}

/* ===================== Render conversation list ===================== */
function renderConvList(){
  const wrap = document.getElementById('convItems');
  wrap.innerHTML = '';
  conversations
    .filter(c=> filterTab==='all' || c.unread>0)
    .filter(c=> !searchTerm || c.name.toLowerCase().includes(searchTerm))
    .forEach(c=>{
      const last = c.messages[c.messages.length-1];
      const preview = last.bot ? (last.title+': '+last.text) : (last.who===ME ? 'Bạn: '+last.text : last.text);
      const row = document.createElement('div');
      row.className = 'conv-item' + (c.id===activeId?' active':'');
      row.innerHTML = `
        ${convAvatarHTML(c)}
        <div class="conv-body">
          <div class="conv-top"><span class="conv-name">${c.name}</span><span class="conv-time">${last.time}</span></div>
          <div class="conv-bottom"><span class="conv-preview">${preview}</span>${c.unread>0?`<span class="conv-unread">${c.unread}</span>`:''}</div>
        </div>`;
      row.onclick = ()=>{ activeId=c.id; c.unread=0; renderConvList(); renderThread(); renderInfo(); };
      wrap.appendChild(row);
    });
}

/* ===================== Render thread header + messages ===================== */
function renderThread(){
  const c = conversations.find(x=>x.id===activeId);
  const head = document.getElementById('threadHead');
  head.innerHTML = `
    ${convAvatarHTML(c,36).replace('conv-avatar','conv-avatar t-avatar')}
    <div>
      <div class="t-name">${c.name}</div>
      <div class="t-sub">${c.sub}</div>
    </div>
    <div class="thread-actions">
      <button class="icon-btn" title="Tìm trong hội thoại"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="icon-btn" title="Gọi thoại"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.6 2z"/></svg></button>
      <button class="icon-btn" title="Thành viên nhóm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
    </div>`;

  const box = document.getElementById('threadMessages');
  box.innerHTML = '<div class="date-divider">Hôm nay</div>';
  let lastWho = null;
  c.messages.forEach(m=>{
    if(m.bot){
      lastWho = null;
      const div = document.createElement('div');
      div.className = 'bot-card' + (m.level==='info'?' info':'') ;
      if(m.level==='amber'){ div.style.borderColor='var(--finance)'; div.style.background='var(--finance-tint)'; div.style.color='var(--finance)'; }
      div.innerHTML = `
        <span class="bc-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><line x1="12" y1="10" x2="12" y2="15"/><circle cx="12" cy="18" r="0.6" fill="currentColor" stroke="none"/></svg></span>
        <div class="bc-text"><strong>${m.title}</strong>${m.text}<div class="bc-meta">${m.meta} · ${m.time}</div></div>`;
      box.appendChild(div);
      return;
    }
    const own = m.who===ME;
    const sameAsLast = lastWho===m.who;
    lastWho = m.who;
    const group = document.createElement('div');
    group.className = 'msg-group' + (own?' own':'');
    const avatarHTML = sameAsLast ? `<div style="width:34px;flex:none;"></div>` : `<div class="g-avatar" style="background:${own?COLORS.purple:m.color}">${initials(m.who)}</div>`;
    const nameHTML = (!sameAsLast && !own) ? `<div class="sender-name">${m.who}</div>` : '';
    const fileHTML = m.file ? `<div class="file-chip"><span class="f-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span><span><span class="f-name">${m.file.name}</span><br><span class="f-size">${m.file.size}</span></span></div>` : '';
    group.innerHTML = `${avatarHTML}<div class="g-col">${nameHTML}<div class="bubble">${m.text}${fileHTML}</div><span class="msg-time">${m.time}</span></div>`;
    box.appendChild(group);
  });
  box.scrollTop = box.scrollHeight;
  document.getElementById('typingHint').textContent = (c.id==='g1') ? 'Chị Hoa đang nhập...' : '';
}

/* ===================== Render info panel ===================== */
function renderInfo(){
  const c = conversations.find(x=>x.id===activeId);
  const panel = document.getElementById('infoPanel');
  const heroAvatar = c.type==='dm'
    ? `<div class="avatar-lg round" style="background:${c.color}">${initials(c.name)}</div>`
    : `<div class="avatar-lg" style="background:${c.color}">${iconSvg(c.type==='bot'?'bot':c.icon, c.color)}</div>`;

  let membersHTML = '';
  if(c.members && c.members.length){
    membersHTML = `<div class="info-section"><div class="sec-title">Thành viên (${c.members.length}${c.type==='group' && c.sub ? ' / '+c.sub.split(' ')[0] : ''})</div>` +
      c.members.map(m=>`<div class="member-row"><span class="m-avatar" style="background:${m.color}">${initials(m.name)}</span><span><span class="m-name">${m.name}</span><br><span class="m-role">${m.role}</span></span></div>`).join('') +
      `</div>`;
  }

  let filesHTML = '';
  if(c.files && c.files.length){
    filesHTML = `<div class="info-section"><div class="sec-title">Tệp đã chia sẻ</div>` +
      c.files.map(f=>`<div class="file-row"><span class="f-ico" style="background:var(--danger-tint); color:var(--danger);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span><span><span class="f-n">${f.name}</span><br><span class="f-m">${f.size}</span></span></div>`).join('') +
      `</div>`;
  }

  panel.innerHTML = `
    <div class="info-hero">${heroAvatar}<div class="name">${c.name}</div><div class="sub">${c.sub}</div></div>
    ${membersHTML}
    ${filesHTML}
  `;
}

/* ===================== Gửi tin nhắn ===================== */
function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  const c = conversations.find(x=>x.id===activeId);
  c.messages.push({who:ME, time:'Vừa xong', text});
  input.value='';
  input.style.height='auto';
  renderThread();
  renderConvList();
}
document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height = Math.min(this.scrollHeight,120)+'px';
});

/* ===================== Tìm kiếm & tab ===================== */
document.getElementById('convSearch').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  renderConvList();
});
document.querySelectorAll('.conv-tabs button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.conv-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filterTab = btn.dataset.tab;
    renderConvList();
  };
});

/* ===================== Sáng / tối ===================== */
function updateThemeIcon(theme){
  document.getElementById('themeIconMoon').style.display = theme==='dark' ? 'none' : 'block';
  document.getElementById('themeIconSun').style.display = theme==='dark' ? 'block' : 'none';
}
updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'light');
document.getElementById('themeToggle').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light';
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('siteflow-theme', next); }catch(e){}
  updateThemeIcon(next);
};

/* ===================== Thu gọn sidebar ===================== */
(function(){
  try{
    if(localStorage.getItem('siteflow-sidebar-collapsed') === '1'){
      document.getElementById('appSidebar').classList.add('collapsed');
    }
  }catch(e){}
})();
document.getElementById('sidebarCollapseBtn').addEventListener('click', function(){
  var sb = document.getElementById('appSidebar');
  var collapsed = sb.classList.toggle('collapsed');
  try{ localStorage.setItem('siteflow-sidebar-collapsed', collapsed ? '1' : '0'); }catch(e){}
});

/* ===================== Khởi tạo ===================== */
(function(){
  var hashId = (location.hash || '').replace('#', '');
  if(hashId && conversations.some(function(c){ return c.id === hashId; })){
    activeId = hashId;
  }
})();
renderConvList();
renderThread();
renderInfo();
</script>
